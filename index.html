  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>


    <script id="bukzex-sw-registration">
if ("serviceWorker" in navigator) {
 window.addEventListener("load", async () => {
  if (["localhost","127.0.0.1","::1"].includes(location.hostname)) {
   const hadController = Boolean(navigator.serviceWorker.controller);
   try {
    const registrations = await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations.map(registration => registration.unregister()));
    if ("caches" in window) {
     const keys = await caches.keys();
     await Promise.all(keys.filter(key => key.startsWith("bukzex-")).map(key => caches.delete(key)));
    }
    if (hadController && sessionStorage.getItem("bukzex-v8-local-refresh") !== "1") {
     sessionStorage.setItem("bukzex-v8-local-refresh","1"); location.reload();
    }
   } catch (error) { console.warn("Local preview cache reset could not finish",error); }
  } else {
   navigator.serviceWorker.register("/sw.js",{updateViaCache:"none"})
    .then(registration => registration.update()).catch(error => console.error("BukzEx offline setup failed",error));
  }
 });
}
</script>
    <style id="bukzex-install-style">
      #bukzex-install-button[hidden] { display: none !important; }
      #bukzex-install-button { position: fixed; z-index: 2147483000; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); border: 0; border-radius: 10px; padding: 14px 22px; background: #175c49; color: #fff; box-shadow: 0 8px 28px #0005; font: 700 16px system-ui, sans-serif; cursor: pointer; }
    </style>
    <button id="bukzex-install-button" type="button" hidden>Install BukzEx</button>
    <script id="bukzex-install-handler">
      (() => {
        const button = document.getElementById("bukzex-install-button");
        const installLink = new URLSearchParams(location.search).get("install") === "1";
        const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
        if (standalone) return;
        let installPrompt = null;
        if (installLink) button.hidden = false;
        window.addEventListener("beforeinstallprompt", (event) => {
          event.preventDefault();
          installPrompt = event;
          button.hidden = false;
        });
        button.addEventListener("click", async () => {
          if (!installPrompt) {
            alert("To install BukzEx, open Chrome’s ⋮ menu and choose Install app or Add to Home screen.");
            return;
          }
          await installPrompt.prompt();
          const choice = await installPrompt.userChoice;
          if (choice.outcome === "accepted") button.hidden = true;
          installPrompt = null;
        });
        window.addEventListener("appinstalled", () => { button.hidden = true; });
      })();
    </script>
  </body>
</html>

name: Temporary hosting credential availability check

on:
  push:
    branches:
      - diagnostic/bukzex-pages-discovery

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report credential presence only
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID_SECRET: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_PROJECT_ID_SECRET: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_PROJECT_ID_VAR: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_PROJECT_ID_VAR: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          for name in FIREBASE_SERVICE_ACCOUNT FIREBASE_TOKEN FIREBASE_PROJECT_ID_SECRET VITE_FIREBASE_PROJECT_ID_SECRET FIREBASE_PROJECT_ID_VAR VITE_FIREBASE_PROJECT_ID_VAR CLOUDFLARE_PAGES_TOKEN NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID; do
            if [ -n "${!name}" ]; then
              echo "$name: configured"
            else
              echo "$name: missing"
            fi
          done

name: Temporary customer email and review checks

on:
  push:
    branches:
      - feature/bukzex-customer-emails-reviews

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vite production build
        run: npm run build
      - name: ESLint
        run: npm run lint
      - name: Parse Cloudflare Worker JavaScript
        run: node --check bukzex-shadex-catalog-worker/src/index.js

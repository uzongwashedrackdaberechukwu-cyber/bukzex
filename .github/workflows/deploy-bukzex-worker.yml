name: Deploy BukzEx Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "bukzex-shadex-catalog-worker/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/deploy-bukzex-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BukzEx
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Worker entry files
        run: |
          test -f bukzex-shadex-catalog-worker/wrangler.jsonc || { echo "::error::Missing bukzex-shadex-catalog-worker/wrangler.jsonc"; exit 1; }
          test -f bukzex-shadex-catalog-worker/src/index.js || { echo "::error::Missing bukzex-shadex-catalog-worker/src/index.js"; exit 1; }

      - name: Build BukzEx website
        run: |
          npm ci
          npm run build

      - name: Deploy Worker
        working-directory: bukzex-shadex-catalog-worker
        run: npx --yes wrangler@latest deploy src/index.js --config ./wrangler.jsonc --name bukzex-shadex-catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

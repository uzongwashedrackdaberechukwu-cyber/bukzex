name: Deploy BukzEx live frontend

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "wrangler.site.jsonc"
      - ".github/workflows/deploy-bukzex-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bukzex-live-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BukzEx
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Verify production output
        run: test -s dist/index.html

      - name: Deploy BukzEx frontend to its live Cloudflare custom domain
        run: npx --yes wrangler@latest deploy --config ./wrangler.site.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

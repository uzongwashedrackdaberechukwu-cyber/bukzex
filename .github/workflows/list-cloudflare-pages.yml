name: Temporary Cloudflare Pages project discovery

on:
  push:
    branches:
      - diagnostic/bukzex-pages-discovery

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List Cloudflare Pages projects without deploying
        run: npx --yes wrangler@4 pages project list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
